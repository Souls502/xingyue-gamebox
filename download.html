<script>
(async function(){
 const version=document.getElementById("version");
 const notes=document.getElementById("notes");
 const button=document.getElementById("download");
 const status=document.getElementById("status");
 const SUPABASE_URL="https://vavsdizrdsvavioxsmjh.supabase.co";
 const SUPABASE_KEY="sb_publishable_r1RfRiRkwcDVOoOtO-Vj8w_sQAs2VIk";

 try{
  const url=SUPABASE_URL+
   "/rest/v1/app_releases?select=version,release_notes,apk_url,file_size"+
   "&is_latest=eq.true&order=created_at.desc&limit=1";

  const response=await fetch(url,{
   method:"GET",
   headers:{"apikey":SUPABASE_KEY},
   cache:"no-store"
  });

  if(!response.ok){
   throw new Error("读取版本信息失败（"+response.status+"）");
  }

  const releases=await response.json();
  const release=releases[0];

  if(!release || !release.apk_url){
   throw new Error("暂时没有可下载的最新版本");
  }

  version.textContent="最新版本 · v"+release.version+
   (release.file_size ? " · "+release.file_size : "");

  notes.textContent=release.release_notes || "";
  button.href=release.apk_url;
  button.textContent="立即下载 APK";
  button.classList.remove("disabled");
  button.removeAttribute("aria-disabled");
  status.textContent="星月游戏盒最新版本已就绪";

 }catch(error){
  version.textContent="版本信息暂时无法获取";
  button.textContent="暂时无法下载";
  status.textContent=error.message+"，请稍后刷新页面。";
 }
})();
</script>
