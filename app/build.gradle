plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xingyue.gamebox'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xingyue.gamebox'
        minSdk 23
        targetSdk 35

        versionCode = (findProperty("versionCode") ?: "4").toString().toInteger()
        versionName = (findProperty("versionName") ?: "1.0.4").toString()
    }
}
