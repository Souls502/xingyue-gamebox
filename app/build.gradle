plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xingyue.gamebox'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xingyue.gamebox'
        minSdk 23
        targetSdk 35
        versionCode (project.findProperty('versionCode') ?: '4').toInteger()
        versionName project.findProperty('versionName') ?: '1.0.4'
    }
}
