name: 星月游戏盒 APK Build

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'App version name'
        required: true
        default: '1.0.4'
        type: string
      versionCode:
        description: 'Android version code'
        required: true
        default: '4'
        type: string
  push:
    branches:
      - migration/server-api-20261119

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v4

      - name: 配置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 编译 APK
        run: gradle assembleDebug -PversionName="${{ inputs.versionName || '1.0.4' }}" -PversionCode="${{ inputs.versionCode || '4' }}"

      - name: 保存 APK
        uses: actions/upload-artifact@v4
        with:
          name: XingYue-GameBox-APK
          path: app/build/outputs/apk/debug/*.apk
