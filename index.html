<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星月游戏盒 - 管理后台</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#130e23;color:white;font-family:Arial,sans-serif;padding:18px}
.wrap{max-width:900px;margin:auto}
.panel{background:#302546;border:1px solid #49346c;border-radius:15px;padding:18px;margin:15px 0}
h1{font-size:24px}
h2{font-size:19px}
p{color:#c4b8d9}
input,textarea{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #5c477c;border-radius:8px;background:#1e1730;color:white;font-size:15px}
textarea{min-height:75px}
label{font-size:13px;color:#d7c9ed}
button{border:0;border-radius:8px;padding:11px 16px;background:#7545b5;color:white;font-size:14px;margin:4px}
.secondary{background:#49346c}
.danger{background:#9b354f}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{background:#211a32;padding:13px;border-radius:10px;margin:10px 0}
.game small{display:block;color:#c4b8d9;margin:6px 0}
.hidden{display:none!important}
.status{padding:10px;background:#211a32;border-radius:8px;white-space:pre-wrap}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<h1>✦ 星月游戏盒管理后台</h1>
<p>管理员登录后可以管理游戏信息和 APP 版本。</p>

<section id="login" class="panel">
<h2>管理员登录</h2>
<label>邮箱</label>
<input id="email" type="email" placeholder="管理员邮箱">
<label>密码</label>
<input id="password" type="password" placeholder="登录密码">
<button id="loginBtn">登录</button>
<div id="loginMsg" class="status">请使用管理员账号登录。</div>
</section>

<section id="admin" class="hidden">
<div class="panel">
<h2>管理后台</h2>
<button id="logoutBtn" class="secondary">退出登录</button>
<div id="msg" class="status">已登录</div>
</div>

<div class="panel">
<h2>APP 版本更新</h2>
<p>上传 APK，填写版本号和更新说明，发布新版本。</p>

<form id="releaseForm">
<label>版本号 *</label>
<input id="releaseVersion" required placeholder="例如 1.0.3">

<label>版本代码（可选）</label>
<input id="releaseCode" type="number" min="1" placeholder="例如 3">

<label>更新说明</label>
<textarea id="releaseNotes" placeholder="填写本次更新内容"></textarea>

<label>选择 APK 文件（最大 50 MB）*</label>
<input id="releaseFile" type="file" accept=".apk,application/vnd.android.package-archive" required>

<button type="submit">上传并发布更新</button>
</form>

<div id="releaseMsg" class="status">等待发布。</div>

<h3>已发布版本</h3>
<div id="releaseList">正在加载...</div>
</div>

<div class="panel">
<h2 id="formTitle">添加游戏</h2>
<form id="gameForm">
<input id="gameId" type="hidden">

<label>游戏名称 *</label>
<input id="title" required placeholder="游戏名称">

<label>游戏介绍</label>
<textarea id="description" placeholder="游戏简介"></textarea>

<div class="row">
<div><label>分类</label><input id="category" value="其他"></div>
<div><label>版本</label><input id="version" placeholder="1.0.0"></div>
</div>

<div class="row">
<div><label>文件大小</label><input id="file_size" placeholder="500 MB"></div>
<div><label>排序</label><input id="sort_order" type="number" value="0"></div>
</div>

<label>封面图片链接</label>
<input id="cover_url" type="url" placeholder="https://...">

<label>下载链接</label>
<input id="download_url" type="url" placeholder="https://...">

<label><input id="is_active" type="checkbox" checked style="width:auto"> 在客户端显示</label>
<br>
<button type="submit">保存游戏</button>
<button type="button" id="resetBtn" class="secondary">清空表单</button>
</form>
</div>

<div class="panel">
<h2>游戏列表</h2>
<div id="games">正在加载...</div>
</div>
</section>
</main>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';

const db=createClient(
'https://vavsdizrdsvavioxsmjh.supabase.co',
'sb_publishable_r1RfRiRkwcDVOoOtO-Vj8w_sQAs2VIk'
);

const $=id=>document.getElementById(id);
const login=$('login');
const admin=$('admin');

function msg(id,text){$(id).textContent=text}

function resetForm(){
$('gameForm').reset();
$('gameId').value='';
$('category').value='其他';
$('sort_order').value='0';
$('is_active').checked=true;
$('formTitle').textContent='添加游戏';
}

async function showAdmin(session){
if(session?.user?.app_metadata?.role!=='admin'){
msg('loginMsg','此账号没有管理员权限。');
await db.auth.signOut();
return;
}
login.classList.add('hidden');
admin.classList.remove('hidden');
await loadGames();
await loadReleases();
}

async function loadGames(){
msg('msg','正在加载...');
const {data,error}=await db.from('games')
.select('*')
.order('sort_order')
.order('id',{ascending:false});

if(error){msg('msg','读取失败：'+error.message);return;}

$('games').innerHTML=data.length?'':'暂无游戏，请添加。';

data.forEach(g=>{
const div=document.createElement('div');
div.className='game';

const title=document.createElement('strong');
title.textContent=g.title;

const info=document.createElement('small');
info.textContent=(g.category||'其他')+' · '+(g.version||'未填写版本')+' · '+(g.is_active?'显示中':'已隐藏');

const edit=document.createElement('button');
edit.className='secondary';
edit.textContent='编辑';
edit.onclick=()=>editGame(g);

const del=document.createElement('button');
del.className='danger';
del.textContent='删除';
del.onclick=()=>deleteGame(g.id);

div.append(title,info,edit,del);
$('games').append(div);
});
msg('msg','已加载 '+data.length+' 款游戏。');
}

function editGame(g){
$('gameId').value=g.id;
$('title').value=g.title||'';
$('description').value=g.description||'';
$('category').value=g.category||'其他';
$('version').value=g.version||'';
$('file_size').value=g.file_size||'';
$('sort_order').value=g.sort_order||0;
$('cover_url').value=g.cover_url||'';
$('download_url').value=g.download_url||'';
$('is_active').checked=!!g.is_active;
$('formTitle').textContent='编辑游戏';
window.scrollTo(0,0);
}

async function deleteGame(id){
if(!confirm('确定删除这款游戏吗？'))return;
const {error}=await db.from('games').delete().eq('id',id);
if(error){msg('msg','删除失败：'+error.message);return;}
resetForm();
await loadGames();
}

/* APP 版本管理 */

async function loadReleases(){
const box=$('releaseList');
box.textContent='正在加载...';

const {data,error}=await db.from('app_releases')
.select('*')
.order('created_at',{ascending:false});

if(error){
box.textContent='读取版本失败：'+error.message;
return;
}

box.innerHTML='';

if(!data.length){
box.textContent='暂无已发布版本。';
return;
}

data.forEach(r=>{
const div=document.createElement('div');
div.className='game';

const title=document.createElement('strong');
title.textContent='版本 '+r.version+(r.is_latest?'（当前最新）':'');

const info=document.createElement('small');
info.textContent=(r.version_code?'版本代码 '+r.version_code+' · ':'')+
(r.file_size||'')+' · '+new Date(r.created_at).toLocaleString();

const notes=document.createElement('small');
notes.textContent=r.release_notes||'暂无更新说明';

const link=document.createElement('a');
link.href=r.apk_url;
link.target='_blank';
link.rel='noopener';
link.textContent='下载 APK';
link.style.color='#c9a7ff';

div.append(title,info,notes,link);
box.append(div);
});
}

$('releaseForm').onsubmit=async e=>{
e.preventDefault();

const file=$('releaseFile').files[0];
const version=$('releaseVersion').value.trim();

if(!file||!version){
msg('releaseMsg','请填写版本号并选择 APK 文件。');
return;
}

if(!file.name.toLowerCase().endsWith('.apk')){
msg('releaseMsg','请选择 .apk 文件。');
return;
}

if(file.size>50*1024*1024){
msg('releaseMsg','文件超过 50 MB，请选择较小的 APK。');
return;
}

msg('releaseMsg','正在上传 APK，请不要关闭页面...');

const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
const objectPath=Date.now()+'-'+safeName;

const {data:uploaded,error:uploadError}=await db.storage
.from('app-releases')
.upload(objectPath,file,{
contentType:'application/vnd.android.package-archive',
upsert:false
});

if(uploadError){
msg('releaseMsg','上传失败：'+uploadError.message);
return;
}

const {data:urlData}=db.storage
.from('app-releases')
.getPublicUrl(uploaded.path);

const {data:newRow,error:insertError}=await db
.from('app_releases')
.insert({
version,
version_code:$('releaseCode').value?Number($('releaseCode').value):null,
release_notes:$('releaseNotes').value.trim(),
apk_url:urlData.publicUrl,
file_size:(file.size/1024/1024).toFixed(2)+' MB',
is_latest:false
})
.select()
.single();

if(insertError){
msg('releaseMsg','版本记录保存失败：'+insertError.message+'；APK 已上传但尚未发布。');
return;
}

const {error:clearError}=await db
.from('app_releases')
.update({is_latest:false})
.neq('id',newRow.id);

if(clearError){
msg('releaseMsg','APK 已上传，但切换最新版本失败：'+clearError.message);
return;
}

const {error:latestError}=await db
.from('app_releases')
.update({is_latest:true})
.eq('id',newRow.id);

if(latestError){
msg('releaseMsg','版本已保存，但设为最新失败：'+latestError.message);
return;
}

$('releaseForm').reset();
msg('releaseMsg','发布成功！版本 '+version+' 已上线。');
await loadReleases();
};

/* 登录和游戏保存 */

$('loginBtn').onclick=async()=>{
msg('loginMsg','正在登录...');
const {data,error}=await db.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});
if(error){
msg('loginMsg','登录失败：'+error.message);
return;
}
await showAdmin(data.session);
};

$('logoutBtn').onclick=async()=>{
await db.auth.signOut();
admin.classList.add('hidden');
login.classList.remove('hidden');
$('password').value='';
msg('loginMsg','已退出登录。');
};

$('resetBtn').onclick=resetForm;

$('gameForm').onsubmit=async e=>{
e.preventDefault();

const id=$('gameId').value;
const item={
title:$('title').value.trim(),
description:$('description').value.trim(),
category:$('category').value.trim()||'其他',
version:$('version').value.trim(),
file_size:$('file_size').value.trim(),
sort_order:Number($('sort_order').value)||0,
cover_url:$('cover_url').value.trim(),
download_url:$('download_url').value.trim(),
is_active:$('is_active').checked,
updated_at:new Date().toISOString()
};

msg('msg','正在保存...');

const result=id
?await db.from('games').update(item).eq('id',id)
:await db.from('games').insert(item);

if(result.error){
msg('msg','保存失败：'+result.error.message);
return;
}

msg('msg','保存成功！');
resetForm();
await loadGames();
};

const {data:{session}}=await db.auth.getSession();
if(session)await showAdmin(session);

db.auth.onAuthStateChange((event,session)=>{
if(event==='SIGNED_OUT'){
admin.classList.add('hidden');
login.classList.remove('hidden');
}
});
</script>
</body>
</html>
